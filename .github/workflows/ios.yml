name: Build iOS IPA (KuroMusic)

# Builds the iOS app on macOS and publishes an unsigned-for-distribution .ipa (ad-hoc signed,
# arm64 only) to GitHub Releases. Install it with a re-signing sideloader — Sideloadly,
# AltStore/SideStore or TrollStore — which signs it with your own Apple ID or certificate.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ios.yml'
      - 'iosApp/**'
      - 'scripts/ios/**'
      - 'composeApp/**'
      - 'core/**'
      - 'lastfm/**'
      - 'gradle/**'
      - '*.gradle.kts'
  push:
    branches:
      - 'ios'
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'androidApp/release/**'

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build KuroMusic.ipa
    runs-on: macos-15
    timeout-minutes: 150
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Read app version
        id: version
        run: |
          name=$(sed -n 's/^version-name *= *"\(.*\)"/\1/p' gradle/libs.versions.toml)
          code=$(sed -n 's/^version-code *= *"\(.*\)"/\1/p' gradle/libs.versions.toml)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Linked here first so a Kotlin failure shows up as its own step instead of deep inside
      # the xcodebuild log; Xcode's build phase then reuses this output.
      - name: Link Kotlin framework (release, iosArm64)
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-configuration-cache --stacktrace

      - name: Generate Xcode project
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app (device, arm64, no code signing)
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild \
            -project KuroMusic.xcodeproj \
            -scheme KuroMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.code }}" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E '^(error|warning: .*ComposeApp|\*\*)|error:' || true
          test -d build/Build/Products/Release-iphoneos/KuroMusic.app || { tail -200 xcodebuild.log; exit 1; }

      - name: Package and validate IPA
        run: |
          scripts/ios/package-ipa.sh \
            iosApp/build/Build/Products/Release-iphoneos/KuroMusic.app \
            "KuroMusic-${{ steps.version.outputs.name }}-ios.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroMusic-ios
          path: KuroMusic-*.ipa
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kuromusic-ios-v${{ steps.version.outputs.name }}-${{ github.run_number }}
          name: KuroMusic iOS ${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: KuroMusic-*.ipa
          body: |
            KuroMusic for iPhone and iPad — version ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }}), commit ${{ github.sha }}.

            Install with a sideloading tool that re-signs the app with your own Apple ID or
            certificate: Sideloadly, AltStore/SideStore or TrollStore. Requires iOS 15 or newer.

            Not available on iOS yet: offline downloads, Google Cast, backup/restore, crossfade and the audio effects.
